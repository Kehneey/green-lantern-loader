<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Wake the power ring, charge it on the lantern and take the oath." />
    <title>Sector 2814</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syncopate:wght@400;700&family=Inter:wght@300;400;500;600&display=swap"
    />
    <link rel="stylesheet" href="style.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.167.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.167.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="loader" id="loader" data-stage="loading">
      <div class="backdrop"></div>

      <svg class="beam-layer" aria-hidden="true">
        <defs>
          <linearGradient id="beamGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="rgba(160,255,196,0.02)"></stop>
            <stop offset="30%" stop-color="rgba(124,255,170,0.4)"></stop>
            <stop offset="70%" stop-color="rgba(200,255,221,0.75)"></stop>
            <stop offset="100%" stop-color="rgba(90,255,145,0.06)"></stop>
          </linearGradient>
          <filter id="beamGlow">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>
        <line id="beamBlur" class="beam beam-blur" x1="0" y1="0" x2="0" y2="0"></line>
        <line id="beam" class="beam beam-core" x1="0" y1="0" x2="0" y2="0"></line>
      </svg>

      <div class="three-stage" id="threeStage"></div>

      <div class="edge-hint edge-left" id="edgeLeft" aria-hidden="true"></div>
      <div class="edge-hint edge-right" id="edgeRight" aria-hidden="true"></div>
      <div class="pickup-marker" id="pickupMarker" aria-hidden="true"></div>

      <section class="oath" id="oath" aria-label="The oath"></section>

      <div class="cues" id="cues" aria-hidden="true"></div>

      <p class="prompt" id="prompt"></p>
      <div class="sr-only" id="srStatus" role="status" aria-live="polite"></div>

      <!-- Letterbox chrome -->
      <header class="chrome chrome-top">
        <span class="mark">Sector <b>2814</b></span>
        <div class="chrome-actions">
          <button class="skip" id="skipIntro" type="button" hidden>Skip</button>
          <button class="sound" id="soundToggle" type="button" aria-pressed="false" aria-label="Sound">
            <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="sound-label" id="soundLabel">Sound</span>
          </button>
        </div>
      </header>

      <footer class="chrome chrome-bottom">
        <span class="power">Ring power <b id="powerText">000</b></span>
        <span class="track" aria-hidden="true"><span id="powerFill"></span></span>
        <span class="chapter"><b id="chapterNum">01</b> <span id="chapterName">The Ring</span></span>
      </footer>

      <div class="flash" id="flash"></div>

      <section class="reveal" id="reveal" aria-hidden="true" aria-labelledby="revealTitle">
        <div class="reveal-head">
          <span class="reveal-kicker">Ring fully charged</span>
          <h1 id="revealTitle">
            <span class="title-line">Welcome,</span>
            <span class="title-line title-accent">Green Lantern</span>
          </h1>
          <p class="reveal-sector">Sector 2814 &nbsp;·&nbsp; Earth's Guardian</p>
          <p class="reveal-id"><span id="callsign"></span> &nbsp;·&nbsp; <span id="lanternId"></span> &nbsp;·&nbsp; charged in <span id="chargeTime"></span></p>
        </div>

        <div class="reveal-foot">
          <p class="construct-readout" id="constructReadout" aria-live="polite">Your will, made solid. Build a construct.</p>
          <div class="reveal-actions">
            <button id="buildBtn" type="button" class="primary">Build a construct</button>
            <button id="copyId" type="button">Copy ID</button>
            <button id="restart" type="button">Recharge</button>
          </div>
          <p class="reveal-hint">Or tap anywhere</p>
        </div>
      </section>

      <div class="constructs" id="constructs" aria-hidden="true"></div>

      <!-- Title sequence -->
      <section class="intro" id="intro" aria-label="Title">
        <div class="intro-title">
          <span class="intro-kicker">In brightest day &nbsp;·&nbsp; In blackest night</span>
          <h1 class="intro-name">Sector<br /><span>2814</span></h1>
          <span class="intro-sub">Every ring chooses</span>

          <button class="enter" id="enterBtn" type="button" disabled>
            <svg class="enter-progress" viewBox="0 0 100 100" aria-hidden="true">
              <circle cx="50" cy="50" r="48"></circle>
              <circle class="enter-fill" id="enterFill" cx="50" cy="50" r="48"></circle>
            </svg>
            <span id="enterLabel">Loading</span>
          </button>

          <span class="intro-note">Best experienced with sound</span>
          <button class="enter-quiet" id="enterQuiet" type="button" disabled>Enter without sound</button>
          <span class="intro-label" id="introLabel"></span>
        </div>
      </section>

      <div class="hand ghost-hand" id="ghost" aria-hidden="true"></div>
      <div class="hand" id="hand" aria-hidden="true"></div>
    </main>

    <noscript>
      <p class="noscript">This experience needs JavaScript and WebGL.</p>
    </noscript>

    <script type="module" src="script.js"></script>
  </body>
</html>
